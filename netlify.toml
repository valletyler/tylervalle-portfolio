[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "https://tylervalle.higgsfield.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
